name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.11

      - name: ruff check
        run: ruff check berp_lao

      - name: ruff format --check
        run: ruff format --check berp_lao

      - name: Validate JSON assets
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for path in pathlib.Path("berp_lao").rglob("*.json"):
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          for path in pathlib.Path("berp_lao").rglob("*.geojson"):
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all JSON assets parse")
          PY

  tests:
    name: Tests (Frappe ${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        branch: [version-15]

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout berp_lao
        uses: actions/checkout@v4
        with:
          path: berp_lao_app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mariadb-client libmariadb-dev wkhtmltopdf

      - name: Configure MariaDB for Frappe
        run: |
          mysql -h 127.0.0.1 -u root -proot -e \
            "SET GLOBAL character_set_server = 'utf8mb4';
             SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Install bench
        run: pip install frappe-bench

      - name: Init bench
        run: |
          bench init --skip-redis-config-generation --skip-assets \
            --python "$(which python)" --frappe-branch ${{ matrix.branch }} frappe-bench

      - name: Configure hosts
        working-directory: frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache "redis://127.0.0.1:6379"
          bench set-config -g redis_queue "redis://127.0.0.1:6379"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379"

      - name: Get ERPNext and berp_lao
        working-directory: frappe-bench
        run: |
          bench get-app --branch ${{ matrix.branch }} --skip-assets erpnext
          bench get-app --skip-assets berp_lao "${GITHUB_WORKSPACE}/berp_lao_app"

      - name: Create test site
        working-directory: frappe-bench
        run: |
          bench new-site test_site \
            --db-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site test_site install-app erpnext
          bench --site test_site install-app berp_lao
          bench --site test_site set-config allow_tests true

      - name: Run berp_lao tests
        working-directory: frappe-bench
        run: bench --site test_site run-tests --app berp_lao

      - name: Show error log on failure
        if: failure()
        working-directory: frappe-bench
        run: |
          cat sites/test_site/logs/*.log 2>/dev/null || true
          bench --site test_site execute \
            'frappe.client.get_list' --kwargs "{'doctype':'Error Log','limit_page_length':5}" || true
